  <text x="874" y="127" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="13" font-weight="700" fill="#F59E0B">评审</text>
  <text x="874" y="143" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="13" font-weight="700" fill="#F59E0B">中</text>

  <line x1="952" y1="134" x2="972" y2="134" stroke="#2D3748" stroke-width="1.5"/>
