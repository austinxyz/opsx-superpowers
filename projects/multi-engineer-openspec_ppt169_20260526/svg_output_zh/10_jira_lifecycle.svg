  <rect x="978" y="236" width="238" height="120" rx="8" fill="#1C1F2E" stroke="#34D399" stroke-width="1.5"/>
  <text x="1097" y="258" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="11" font-weight="600" fill="#34D399">触发</text>
  <text x="1097" y="276" text-anchor="middle" font-family="JetBrains Mono, Consolas, monospace" font-size="11" fill="#34D399">opsx archive（DoD 通过）</text>
  <rect x="990" y="290" width="214" height="1" fill="#2D3748"/>
  <text x="1097" y="308" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="11" font-weight="600" fill="#34D399">链接已添加</text>
  <text x="1097" y="326" text-anchor="middle" font-family="JetBrains Mono, Consolas, monospace" font-size="11" fill="#94A3B8">pitfalls.md · 规范已归档</text>
  <text x="1097" y="344" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="10" fill="#64748B">JIRA Done 转换解锁</text>
  <line x1="1038" y1="156" x2="1038" y2="236" stroke="#34D399" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- Bottom section: how it works -->
  <rect x="64" y="388" width="1152" height="180" rx="12" fill="#1C1F2E" stroke="#2D3748" stroke-width="1"/>

  <!-- Left: .meta.yaml -->
  <text x="88" y="414" font-family="PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="13" font-weight="600" fill="#4F8EF7">openspec/topics/auth-refactor/.meta.yaml</text>
  <rect x="88" y="424" width="340" height="132" rx="6" fill="#0F1117" stroke="#2D3748" stroke-width="1"/>
  <text x="104" y="444" font-family="JetBrains Mono, Consolas, monospace" font-size="12" fill="#94A3B8">topic: auth-refactor</text>
  <text x="104" y="462" font-family="JetBrains Mono, Consolas, monospace" font-size="12" fill="#F59E0B">jira_key: PROJ-123</text>
  <text x="104" y="480" font-family="JetBrains Mono, Consolas, monospace" font-size="12" fill="#94A3B8">jira_project: PROJ</text>
  <text x="104" y="498" font-family="JetBrains Mono, Consolas, monospace" font-size="12" fill="#94A3B8">track: large</text>
  <text x="104" y="516" font-family="JetBrains Mono, Consolas, monospace" font-size="12" fill="#34D399">phase: applying</text>
  <text x="104" y="534" font-family="JetBrains Mono, Consolas, monospace" font-size="12" fill="#64748B">pr1_url: https://git/...</text>

  <!-- Center: hook interface -->
  <line x1="452" y1="404" x2="452" y2="556" stroke="#2D3748" stroke-width="1"/>
  <text x="476" y="414" font-family="PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="13" font-weight="600" fill="#818CF8">jira_hook.py — 由每个 opsx 命令调用</text>
  <rect x="476" y="424" width="360" height="132" rx="6" fill="#0F1117" stroke="#2D3748" stroke-width="1"/>
  <text x="492" y="444" font-family="JetBrains Mono, Consolas, monospace" font-size="12" fill="#64748B">jira_hook.py &lt;phase&gt; &lt;topic&gt;</text>
  <text x="492" y="464" font-family="PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="11" fill="#94A3B8">读取：.meta.yaml · eval-log.md · $JIRA_TOKEN</text>
  <text x="492" y="482" font-family="PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="11" fill="#34D399">exit 0 → 成功或 jira_key 不存在</text>
  <text x="492" y="500" font-family="PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="11" fill="#F87171">exit 1 → DoD 失败（仅限归档阶段）</text>
  <text x="492" y="518" font-family="PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="11" fill="#64748B">exit 2 → JIRA API 错误（非致命）</text>
  <text x="492" y="540" font-family="PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="11" fill="#64748B">无 JIRA_TOKEN → 静默跳过</text>

  <!-- Right: key rules -->
  <line x1="860" y1="404" x2="860" y2="556" stroke="#2D3748" stroke-width="1"/>
  <text x="884" y="414" font-family="PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="13" font-weight="600" fill="#34D399">关键规则</text>
  <text x="884" y="438" font-family="PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="13" fill="#94A3B8">• JIRA 故障不会导致构建失败</text>
  <text x="884" y="460" font-family="PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="13" fill="#94A3B8">• 无 jira_key → 所有 hooks 静默跳过</text>
  <text x="884" y="482" font-family="PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="13" fill="#94A3B8">• 本地开发：无 token → 不调用 JIRA</text>
  <text x="884" y="504" font-family="PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="13" fill="#94A3B8">• Hooks 在阶段文件写入后运行</text>
  <text x="884" y="526" font-family="PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="13" fill="#94A3B8">• 小型轨道：规范评审跳过</text>

  <!-- Bottom bar -->
  <rect x="64" y="588" width="1152" height="44" rx="8" fill="#0F1117" stroke="#2D3748" stroke-width="1"/>
  <text x="640" y="610" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="13" fill="#94A3B8">同时支持两种流程：JIRA 优先（PM 创建工单 → 工程师设置 jira_key）和 OpenSpec 优先（工程师启动规范 → 稍后关联工单）</text>

  <!-- Slide number -->
  <text x="1216" y="700" text-anchor="end" font-family="PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="14" fill="#64748B">10 / 11</text>
