  <text x="84" y="60" font-family="PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="32" font-weight="700" fill="#E2E8F0">OpenSpec + JIRA — 自动化生命周期</text>
  <text x="84" y="88" font-family="PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="15" fill="#94A3B8">零手动 JIRA 更新 · jira_key 在 .meta.yaml 中为可选 · hooks 作为 opsx 后置步骤运行</text>

  <!-- Status 1: Exploring -->
