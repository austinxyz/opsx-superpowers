  <!-- Detail cards -->
  <!-- Card 1: Exploring -->
  <rect x="64" y="236" width="156" height="120" rx="8" fill="#1C1F2E" stroke="#4F8EF7" stroke-width="1"/>
  <text x="142" y="258" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="11" font-weight="600" fill="#4F8EF7">触发</text>
