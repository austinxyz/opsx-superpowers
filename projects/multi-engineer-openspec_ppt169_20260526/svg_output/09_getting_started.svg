<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4F8EF7"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
    <linearGradient id="card1Grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4F8EF7" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#4F8EF7" stop-opacity="0.03"/>
    </linearGradient>
    <linearGradient id="card2Grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#818CF8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0.03"/>
    </linearGradient>
    <linearGradient id="card3Grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34D399" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#34D399" stop-opacity="0.03"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="720" fill="#0F1117"/>

  <!-- Title -->
  <rect x="64" y="36" width="4" height="48" fill="url(#titleGrad)" rx="2"/>
  <text x="84" y="68" font-family="Inter, system-ui, sans-serif" font-size="44" font-weight="700" fill="url(#titleGrad)">Start Here</text>
  <text x="84" y="104" font-family="Inter, system-ui, sans-serif" font-size="18" fill="#94A3B8">Three actions to adopt the OpenSpec workflow on your next feature</text>

  <!-- Card 1: Explore -->
  <rect x="64" y="128" width="360" height="432" rx="12" fill="url(#card1Grad)" stroke="#4F8EF7" stroke-width="2"/>
  <!-- Big number -->
  <circle cx="144" cy="196" r="40" fill="#4F8EF7" fill-opacity="0.15" stroke="#4F8EF7" stroke-width="1.5"/>
  <text x="144" y="196" text-anchor="middle" dominant-baseline="middle" font-family="Inter, system-ui, sans-serif" font-size="32" font-weight="700" fill="#4F8EF7">1</text>
  <!-- Icon -->
  <text x="280" y="196" text-anchor="middle" dominant-baseline="middle" font-family="Inter, system-ui, sans-serif" font-size="52">🔍</text>
  <!-- Divider -->
  <rect x="88" y="248" width="312" height="2" fill="#2D3748"/>
  <!-- Title -->
  <text x="244" y="286" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="700" fill="#4F8EF7">Run /opsx:explore</text>
  <!-- Description -->
  <text x="244" y="320" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="15" fill="#E2E8F0">Before writing any code.</text>
  <text x="244" y="344" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="15" fill="#E2E8F0">On your very next feature.</text>
  <text x="244" y="380" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="14" fill="#94A3B8">Turns rough idea into reviewed</text>
  <text x="244" y="400" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="14" fill="#94A3B8">requirements.md with status REVIEWED</text>
  <!-- Code block -->
  <rect x="88" y="424" width="312" height="48" rx="6" fill="#0F1117" stroke="#2D3748" stroke-width="1"/>
  <text x="244" y="448" text-anchor="middle" dominant-baseline="middle" font-family="JetBrains Mono, monospace" font-size="14" fill="#34D399">/opsx:explore auth-refactor</text>
  <!-- Timing label -->
  <text x="244" y="504" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#64748B">Today. No exceptions.</text>

  <!-- Card 2: Spec PR -->
  <rect x="460" y="128" width="360" height="432" rx="12" fill="url(#card2Grad)" stroke="#818CF8" stroke-width="2"/>
  <circle cx="540" cy="196" r="40" fill="#818CF8" fill-opacity="0.15" stroke="#818CF8" stroke-width="1.5"/>
  <text x="540" y="196" text-anchor="middle" dominant-baseline="middle" font-family="Inter, system-ui, sans-serif" font-size="32" font-weight="700" fill="#818CF8">2</text>
  <text x="680" y="196" text-anchor="middle" dominant-baseline="middle" font-family="Inter, system-ui, sans-serif" font-size="52">📋</text>
  <rect x="484" y="248" width="312" height="2" fill="#2D3748"/>
  <text x="640" y="281" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="700" fill="#818CF8">Open spec PR first</text>
  <text x="640" y="311" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="14" fill="#94A3B8">For large features (≥3 days / arch)</text>
  <text x="640" y="344" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="15" fill="#E2E8F0">Lock the spec before any code.</text>
  <text x="640" y="368" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="15" fill="#E2E8F0">PR1 = spec review gate.</text>
  <text x="640" y="404" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="14" fill="#94A3B8">tasks.md + design.md frozen</text>
  <text x="640" y="424" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="14" fill="#94A3B8">after PR1 merges</text>
  <rect x="484" y="448" width="312" height="48" rx="6" fill="#0F1117" stroke="#2D3748" stroke-width="1"/>
  <text x="640" y="466" text-anchor="middle" dominant-baseline="middle" font-family="JetBrains Mono, monospace" font-size="13" fill="#818CF8">spec/auth-refactor → PR1 review</text>
  <text x="640" y="504" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#64748B">Small features: skip to apply directly.</text>

  <!-- Card 3: Harness -->
  <rect x="856" y="128" width="360" height="432" rx="12" fill="url(#card3Grad)" stroke="#34D399" stroke-width="2"/>
  <circle cx="936" cy="196" r="40" fill="#34D399" fill-opacity="0.15" stroke="#34D399" stroke-width="1.5"/>
  <text x="936" y="196" text-anchor="middle" dominant-baseline="middle" font-family="Inter, system-ui, sans-serif" font-size="32" font-weight="700" fill="#34D399">3</text>
  <text x="1076" y="196" text-anchor="middle" dominant-baseline="middle" font-family="Inter, system-ui, sans-serif" font-size="52">⚙️</text>
  <rect x="880" y="248" width="312" height="2" fill="#2D3748"/>
  <text x="1036" y="281" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="700" fill="#34D399">Let harness drive apply</text>
  <text x="1036" y="311" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="14" fill="#94A3B8">TDD + evaluator subagent runs</text>
  <text x="1036" y="344" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="15" fill="#E2E8F0">Review spec fidelity, not code.</text>
  <text x="1036" y="368" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="15" fill="#E2E8F0">You judge intent. Claude builds.</text>
  <text x="1036" y="404" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="14" fill="#94A3B8">Ask: "Did Claude build</text>
  <text x="1036" y="424" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="14" fill="#94A3B8">the right thing?"</text>
  <rect x="880" y="448" width="312" height="48" rx="6" fill="#0F1117" stroke="#2D3748" stroke-width="1"/>
  <text x="1036" y="466" text-anchor="middle" dominant-baseline="middle" font-family="JetBrains Mono, monospace" font-size="13" fill="#34D399">/opsx:apply auth-refactor</text>
  <text x="1036" y="504" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#64748B">Then: /opsx:archive to achieve.</text>

  <!-- Bottom achieve callout -->
  <rect x="64" y="584" width="1152" height="64" rx="8" fill="#1C1F2E" stroke="#34D399" stroke-width="1.5"/>
  <text x="640" y="608" text-anchor="middle" dominant-baseline="middle" font-family="Inter, system-ui, sans-serif" font-size="14" fill="#94A3B8">Achieve =</text>
  <text x="640" y="608" text-anchor="middle" dominant-baseline="middle" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="600" fill="#34D399">       archive ✓  +  CI green ✓  +  PR merged ✓</text>
  <text x="640" y="634" text-anchor="middle" dominant-baseline="middle" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#64748B">opsx-superpowers · Four phases · Zero skipped gates · Spec quality = delivery quality</text>

  <!-- Slide number -->
  <text x="1216" y="700" text-anchor="end" font-family="Inter, system-ui, sans-serif" font-size="14" fill="#64748B">9 / 11</text>
</svg>
