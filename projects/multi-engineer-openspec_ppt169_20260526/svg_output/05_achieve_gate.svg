<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4F8EF7"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="720" fill="#0F1117"/>

  <!-- Title -->
  <rect x="64" y="36" width="4" height="36" fill="url(#titleGrad)" rx="2"/>
  <text x="84" y="60" font-family="Inter, system-ui, sans-serif" font-size="32" font-weight="700" fill="#E2E8F0">Apply ≠ Achieve</text>
  <text x="84" y="88" font-family="Inter, system-ui, sans-serif" font-size="16" fill="#94A3B8">Four gates between "code done" and "shipped" — all must pass in order</text>

  <!-- Layer 1: Local Eval -->
  <rect x="64" y="108" width="1152" height="88" rx="8" fill="#1C1F2E" stroke="#4F8EF7" stroke-width="1.5"/>
  <rect x="64" y="108" width="6" height="88" rx="3" fill="#4F8EF7"/>
  <circle cx="112" cy="152" r="20" fill="#4F8EF7" fill-opacity="0.2" stroke="#4F8EF7" stroke-width="1.5"/>
  <text x="112" y="152" text-anchor="middle" dominant-baseline="middle" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="700" fill="#4F8EF7">1</text>
  <text x="148" y="142" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="700" fill="#4F8EF7">⚙️ Local Eval</text>
  <text x="148" y="166" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#94A3B8">Evaluator subagent · fresh context · skeptical reviewer</text>
  <line x1="310" y1="118" x2="310" y2="186" stroke="#2D3748" stroke-width="1"/>
  <text x="326" y="135" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600" fill="#34D399">✅ PASSES WHEN</text>
  <text x="326" y="154" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#E2E8F0">All evals green · No CRITICAL findings · Spec fidelity confirmed</text>
  <text x="326" y="173" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#94A3B8">Evaluator scores: Spec / Runtime / Code quality</text>
  <line x1="900" y1="118" x2="900" y2="186" stroke="#2D3748" stroke-width="1"/>
  <text x="916" y="135" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600" fill="#F87171">🔁 ON FAIL</text>
  <text x="916" y="154" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#E2E8F0">Claude retries (max 3)</text>
  <text x="916" y="173" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#94A3B8">Plateau → engineer reviews diff</text>

  <!-- Arrow 1→2 -->
  <line x1="640" y1="196" x2="640" y2="212" stroke="#4F8EF7" stroke-width="2"/>
  <polygon points="634,210 640,220 646,210" fill="#4F8EF7"/>

  <!-- Layer 2: CI -->
  <rect x="64" y="220" width="1152" height="88" rx="8" fill="#1C1F2E" stroke="#818CF8" stroke-width="1.5"/>
  <rect x="64" y="220" width="6" height="88" rx="3" fill="#818CF8"/>
  <circle cx="112" cy="264" r="20" fill="#818CF8" fill-opacity="0.2" stroke="#818CF8" stroke-width="1.5"/>
  <text x="112" y="264" text-anchor="middle" dominant-baseline="middle" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="700" fill="#818CF8">2</text>
  <text x="148" y="254" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="700" fill="#818CF8">🤖 CI Pipeline</text>
  <text x="148" y="278" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#94A3B8">GitHub Actions / Jenkins · automated quality gate</text>
  <line x1="310" y1="230" x2="310" y2="298" stroke="#2D3748" stroke-width="1"/>
  <text x="326" y="248" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600" fill="#34D399">✅ PASSES WHEN</text>
  <text x="326" y="267" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#E2E8F0">Build ✓ · Unit + Integration tests ✓ · E2E green</text>
  <text x="326" y="286" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#94A3B8">All automated checks clear · no regressions</text>
  <line x1="900" y1="230" x2="900" y2="298" stroke="#2D3748" stroke-width="1"/>
  <text x="916" y="248" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600" fill="#F87171">🔁 ON FAIL</text>
  <text x="916" y="267" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#E2E8F0">Fix before next push</text>
  <text x="916" y="286" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#94A3B8">No force-merge allowed</text>

  <!-- Arrow 2→3 -->
  <line x1="640" y1="308" x2="640" y2="324" stroke="#818CF8" stroke-width="2"/>
  <polygon points="634,322 640,332 646,322" fill="#818CF8"/>

  <!-- Layer 3: PR Review -->
  <rect x="64" y="332" width="1152" height="88" rx="8" fill="#1C1F2E" stroke="#34D399" stroke-width="1.5"/>
  <rect x="64" y="332" width="6" height="88" rx="3" fill="#34D399"/>
  <circle cx="112" cy="376" r="20" fill="#34D399" fill-opacity="0.2" stroke="#34D399" stroke-width="1.5"/>
  <text x="112" y="376" text-anchor="middle" dominant-baseline="middle" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="700" fill="#34D399">3</text>
  <text x="148" y="366" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="700" fill="#34D399">👥 PR Review</text>
  <text x="148" y="390" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#94A3B8">Human spec-fidelity gate</text>
  <line x1="310" y1="342" x2="310" y2="410" stroke="#2D3748" stroke-width="1"/>
  <text x="326" y="360" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600" fill="#34D399">✅ PASSES WHEN</text>
  <text x="326" y="379" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#E2E8F0">Spec intent matched · CONTRACT blocks honored · ≥1 approval</text>
  <text x="326" y="398" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#94A3B8">Reviewer asks: "Did Claude build the right thing?"</text>
  <line x1="900" y1="342" x2="900" y2="410" stroke="#2D3748" stroke-width="1"/>
  <text x="916" y="360" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600" fill="#F87171">🔁 ON FAIL</text>
  <text x="916" y="379" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#E2E8F0">Address comments · re-push</text>
  <text x="916" y="398" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#94A3B8">Re-evaluate after changes</text>

  <!-- Arrow 3→4 -->
  <line x1="640" y1="420" x2="640" y2="436" stroke="#34D399" stroke-width="2"/>
  <polygon points="634,434 640,444 646,434" fill="#34D399"/>

  <!-- Layer 4: Archive -->
  <rect x="64" y="444" width="1152" height="88" rx="8" fill="#1C1F2E" stroke="#F59E0B" stroke-width="1.5"/>
  <rect x="64" y="444" width="6" height="88" rx="3" fill="#F59E0B"/>
  <circle cx="112" cy="488" r="20" fill="#F59E0B" fill-opacity="0.2" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="112" y="488" text-anchor="middle" dominant-baseline="middle" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="700" fill="#F59E0B">4</text>
  <text x="148" y="478" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="700" fill="#F59E0B">📦 Archive</text>
  <text x="148" y="502" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#94A3B8">Knowledge capture · merge unlock prerequisite</text>
  <line x1="310" y1="454" x2="310" y2="522" stroke="#2D3748" stroke-width="1"/>
  <text x="326" y="472" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600" fill="#34D399">✅ PASSES WHEN</text>
  <text x="326" y="491" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#E2E8F0">pitfalls.md captured · CLAUDE.md index updated · spec.md → DONE</text>
  <text x="326" y="510" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#94A3B8">Prerequisite for merging PR to main</text>
  <line x1="900" y1="454" x2="900" y2="522" stroke="#2D3748" stroke-width="1"/>
  <text x="916" y="472" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600" fill="#64748B">— TERMINAL</text>
  <text x="916" y="491" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#94A3B8">Archive first, then merge</text>
  <text x="916" y="510" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#64748B">No retry needed</text>

  <!-- Arrow 4→Achieve -->
  <line x1="640" y1="532" x2="640" y2="550" stroke="#F59E0B" stroke-width="2"/>
  <polygon points="634,548 640,558 646,548" fill="#F59E0B"/>

  <!-- Achieve pill -->
  <rect x="360" y="558" width="560" height="60" rx="30" fill="#34D399" fill-opacity="0.12" stroke="#34D399" stroke-width="2"/>
  <text x="640" y="588" text-anchor="middle" dominant-baseline="middle" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="700" fill="#34D399">🎯 ACHIEVE — PR merged to main</text>

  <!-- Slide number -->
  <text x="1216" y="700" text-anchor="end" font-family="Inter, system-ui, sans-serif" font-size="14" fill="#64748B">5 / 9</text>
</svg>
