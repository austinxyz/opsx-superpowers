  <text x="84" y="60" font-family="Inter, system-ui, sans-serif" font-size="32" font-weight="700" fill="#E2E8F0">Archive in Parallel, No Conflicts</text>
  <text x="84" y="88" font-family="Inter, system-ui, sans-serif" font-size="16" fill="#94A3B8">Shared files become write bottlenecks at scale — decompose them</text>

  
