  <text x="640" y="281" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="700" fill="#818CF8">Open spec PR first</text>
  <text x="640" y="311" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="14" fill="#94A3B8">For large features (≥3 days / arch)</text>
  <text x="640" y="344" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="15" fill="#E2E8F0">Lock the spec before any code.</text>
  <text x="640" y="368" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="15" fill="#E2E8F0">PR1 = spec review gate.</text>
  <text x="640" y="404" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="14" fill="#94A3B8">tasks.md + design.md frozen</text>
  <text x="640" y="424" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="14" fill="#94A3B8">after PR1 merges</text>
  <path fill="#0F1117" stroke="#2D3748" stroke-width="1" d="M490,448 H790 A6,6 0 0 1 796,454 V490 A6,6 0 0 1 790,496 H490 A6,6 0 0 1 484,490 V454 A6,6 0 0 1 490,448 Z" />
  <text x="640" y="466" text-anchor="middle" dominant-baseline="middle" font-family="JetBrains Mono, monospace" font-size="13" fill="#818CF8">spec/auth-refactor → PR1 review</text>
  <text x="640" y="504" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#64748B">Small features: skip to apply directly.</text>

  
  <path fill="url(#card3Grad)" stroke="#34D399" stroke-width="2" d="M868,128 H1204 A12,12 0 0 1 1216,140 V548 A12,12 0 0 1 1204,560 H868 A12,12 0 0 1 856,548 V140 A12,12 0 0 1 868,128 Z" />
