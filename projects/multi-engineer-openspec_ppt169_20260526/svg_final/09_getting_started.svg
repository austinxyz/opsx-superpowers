  <text x="1076" y="196" text-anchor="middle" dominant-baseline="middle" font-family="Inter, system-ui, sans-serif" font-size="52">⚙️</text>
  <rect x="880" y="248" width="312" height="2" fill="#2D3748" />
  <text x="1036" y="281" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="700" fill="#34D399">Let harness drive apply</text>
  <text x="1036" y="311" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="14" fill="#94A3B8">TDD + evaluator subagent runs</text>
  <text x="1036" y="344" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="15" fill="#E2E8F0">Review spec fidelity, not code.</text>
  <text x="1036" y="368" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="15" fill="#E2E8F0">You judge intent. Claude builds.</text>
  <text x="1036" y="404" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="14" fill="#94A3B8">Ask: "Did Claude build</text>
  <text x="1036" y="424" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="14" fill="#94A3B8">the right thing?"</text>
  <path fill="#0F1117" stroke="#2D3748" stroke-width="1" d="M886,448 H1186 A6,6 0 0 1 1192,454 V490 A6,6 0 0 1 1186,496 H886 A6,6 0 0 1 880,490 V454 A6,6 0 0 1 886,448 Z" />
  <text x="1036" y="466" text-anchor="middle" dominant-baseline="middle" font-family="JetBrains Mono, monospace" font-size="13" fill="#34D399">/opsx:apply auth-refactor</text>
  <text x="1036" y="504" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#64748B">Then: /opsx:archive to achieve.</text>

  
  <path fill="#1C1F2E" stroke="#34D399" stroke-width="1.5" d="M72,584 H1208 A8,8 0 0 1 1216,592 V640 A8,8 0 0 1 1208,648 H72 A8,8 0 0 1 64,640 V592 A8,8 0 0 1 72,584 Z" />
