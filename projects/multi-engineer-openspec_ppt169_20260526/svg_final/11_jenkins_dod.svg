<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4F8EF7" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>
    <linearGradient id="passGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34D399" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#34D399" stop-opacity="0.04" />
    </linearGradient>
    <linearGradient id="failGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F87171" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#F87171" stop-opacity="0.04" />
    </linearGradient>
  </defs>
  <rect width="1280" height="720" fill="#0F1117" />

  
  <path fill="url(#titleGrad)" d="M66,36 H66 A2,2 0 0 1 68,38 V82 A2,2 0 0 1 66,84 H66 A2,2 0 0 1 64,82 V38 A2,2 0 0 1 66,36 Z" />
  <text x="84" y="68" font-family="Inter, system-ui, sans-serif" font-size="40" font-weight="700" fill="url(#titleGrad)">Jenkins DoD Gate</text>
  <text x="84" y="100" font-family="Inter, system-ui, sans-serif" font-size="16" fill="#94A3B8">opsx archive runs four checks — all must pass before JIRA transitions to Done</text>

  
  <path fill="#131820" stroke="#2D3748" stroke-width="1.5" d="M74,120 H594 A10,10 0 0 1 604,130 V630 A10,10 0 0 1 594,640 H74 A10,10 0 0 1 64,630 V130 A10,10 0 0 1 74,120 Z" />
  <text x="84" y="148" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" fill="#64748B" letter-spacing="1">JENKINSFILE</text>

  
  <path fill="#0B0F16" stroke="#1E2533" stroke-width="1" d="M86,160 H582 A6,6 0 0 1 588,166 V618 A6,6 0 0 1 582,624 H86 A6,6 0 0 1 80,618 V166 A6,6 0 0 1 86,160 Z" />

  
  <text x="96" y="183" font-family="JetBrains Mono, monospace" font-size="11.5" fill="#64748B">// TOPIC auto-derived from branch or explicit param</text>
  <text x="96" y="203" font-family="JetBrains Mono, monospace" font-size="11.5" fill="#818CF8">pipeline {</text>
  <text x="96" y="221" font-family="JetBrains Mono, monospace" font-size="11.5" fill="#818CF8">  parameters {</text>
  <text x="96" y="239" font-family="JetBrains Mono, monospace" font-size="11.5" fill="#94A3B8">    string(name: <tspan fill="#34D399">'TOPIC'</tspan>, defaultValue: <tspan fill="#34D399">''</tspan>)</text>
  <text x="96" y="257" font-family="JetBrains Mono, monospace" font-size="11.5" fill="#818CF8">  }</text>
  <text x="96" y="275" font-family="JetBrains Mono, monospace" font-size="11.5" fill="#818CF8">  environment {</text>
  <text x="96" y="293" font-family="JetBrains Mono, monospace" font-size="11.5" fill="#94A3B8">    JIRA_TOKEN    = credentials(<tspan fill="#34D399">'jira-api-token'</tspan>)</text>
  <text x="96" y="311" font-family="JetBrains Mono, monospace" font-size="11.5" fill="#94A3B8">    JIRA_BASE_URL = <tspan fill="#34D399">'https://yourco.atlassian.net'</tspan></text>
  <text x="96" y="329" font-family="JetBrains Mono, monospace" font-size="11.5" fill="#94A3B8">    JIRA_USER     = <tspan fill="#34D399">'ci-bot@yourco.com'</tspan></text>
  <text x="96" y="347" font-family="JetBrains Mono, monospace" font-size="11.5" fill="#818CF8">  }</text>
  <text x="96" y="369" font-family="JetBrains Mono, monospace" font-size="11.5" fill="#818CF8">  stages {</text>

  
  <path fill="#1A2030" stroke="#4F8EF7" stroke-width="1" stroke-opacity="0.5" d="M104,376 H568 A4,4 0 0 1 572,380 V428 A4,4 0 0 1 568,432 H104 A4,4 0 0 1 100,428 V380 A4,4 0 0 1 104,376 Z" />
  <text x="112" y="394" font-family="JetBrains Mono, monospace" font-size="11.5" fill="#4F8EF7">    stage(<tspan fill="#34D399">'apply'</tspan>) {  when { branch <tspan fill="#34D399">'feat/*'</tspan> }</text>
  <text x="112" y="412" font-family="JetBrains Mono, monospace" font-size="11.5" fill="#94A3B8">      TOPIC = params.TOPIC ?: BRANCH_NAME - <tspan fill="#34D399">'feat/'</tspan></text>
  <text x="112" y="428" font-family="JetBrains Mono, monospace" font-size="11.5" fill="#94A3B8">      steps { sh <tspan fill="#34D399">'opsx apply $TOPIC'</tspan> }  }</text>

  
  <path fill="#1A2030" stroke="#818CF8" stroke-width="1" stroke-opacity="0.5" d="M104,440 H568 A4,4 0 0 1 572,444 V474 A4,4 0 0 1 568,478 H104 A4,4 0 0 1 100,474 V444 A4,4 0 0 1 104,440 Z" />
  <text x="112" y="457" font-family="JetBrains Mono, monospace" font-size="11.5" fill="#818CF8">    stage(<tspan fill="#34D399">'test'</tspan>) {</text>
  <text x="112" y="473" font-family="JetBrains Mono, monospace" font-size="11.5" fill="#94A3B8">      steps { sh <tspan fill="#34D399">'make test'</tspan>;  sh <tspan fill="#34D399">'make e2e'</tspan> }  }</text>

  
  <path fill="#142010" stroke="#34D399" stroke-width="1.5" d="M104,486 H568 A4,4 0 0 1 572,490 V544 A4,4 0 0 1 568,548 H104 A4,4 0 0 1 100,544 V490 A4,4 0 0 1 104,486 Z" />
  <text x="112" y="503" font-family="JetBrains Mono, monospace" font-size="11.5" fill="#34D399">    stage(<tspan fill="#34D399">'archive'</tspan>) {  when { branch <tspan fill="#34D399">'main'</tspan> }</text>
  <text x="112" y="521" font-family="JetBrains Mono, monospace" font-size="11.5" fill="#94A3B8">      JENKINS_BUILD_STATUS = currentBuild.result</text>
  <text x="112" y="539" font-family="JetBrains Mono, monospace" font-size="11.5" fill="#94A3B8">      PR_MERGED = <tspan fill="#34D399">'true'</tspan></text>
  <text x="112" y="557" font-family="JetBrains Mono, monospace" font-size="11.5" fill="#94A3B8">      steps { sh <tspan fill="#34D399">'opsx archive $TOPIC'</tspan> }  }  }  }</text>

  <text x="96" y="598" font-family="JetBrains Mono, monospace" font-size="11" fill="#64748B">↑  opsx archive internally calls jira_hook.py</text>
  <text x="96" y="614" font-family="JetBrains Mono, monospace" font-size="11" fill="#64748B">   Jenkins only sets env vars + runs opsx commands</text>

  
  <path fill="#131820" stroke="#2D3748" stroke-width="1.5" d="M634,120 H1206 A10,10 0 0 1 1216,130 V630 A10,10 0 0 1 1206,640 H634 A10,10 0 0 1 624,630 V130 A10,10 0 0 1 634,120 Z" />
  <text x="644" y="148" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" fill="#64748B" letter-spacing="1">DOD GATE — opsx archive</text>

  
  <path fill="#0B0F16" stroke="#2D3748" stroke-width="1" d="M648,160 H1192 A8,8 0 0 1 1200,168 V240 A8,8 0 0 1 1192,248 H648 A8,8 0 0 1 640,240 V168 A8,8 0 0 1 648,160 Z" />
  <path fill="#F59E0B" d="M642,160 H642 A2,2 0 0 1 644,162 V246 A2,2 0 0 1 642,248 H642 A2,2 0 0 1 640,246 V162 A2,2 0 0 1 642,160 Z" />
  <text x="662" y="184" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" fill="#F59E0B">① eval-log.md</text>
  <text x="662" y="204" font-family="JetBrains Mono, monospace" font-size="11.5" fill="#94A3B8">grep "CRITICAL\|HIGH" eval-log.md → exit 1 if found</text>
  <text x="662" y="222" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#64748B">Pass: no CRITICAL or HIGH findings</text>
  <text x="662" y="238" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#64748B">MEDIUM / LOW → warning only, never block</text>

  
  <path fill="#0B0F16" stroke="#2D3748" stroke-width="1" d="M648,258 H1192 A8,8 0 0 1 1200,266 V322 A8,8 0 0 1 1192,330 H648 A8,8 0 0 1 640,322 V266 A8,8 0 0 1 648,258 Z" />
  <path fill="#4F8EF7" d="M642,258 H642 A2,2 0 0 1 644,260 V328 A2,2 0 0 1 642,330 H642 A2,2 0 0 1 640,328 V260 A2,2 0 0 1 642,258 Z" />
  <text x="662" y="282" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" fill="#4F8EF7">② CI green</text>
  <text x="662" y="302" font-family="JetBrains Mono, monospace" font-size="11.5" fill="#94A3B8">$JENKINS_BUILD_STATUS == SUCCESS</text>
  <text x="662" y="320" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#64748B">Pass: previous test stage exited 0</text>

  
  <path fill="#0B0F16" stroke="#2D3748" stroke-width="1" d="M648,340 H1192 A8,8 0 0 1 1200,348 V404 A8,8 0 0 1 1192,412 H648 A8,8 0 0 1 640,404 V348 A8,8 0 0 1 648,340 Z" />
  <path fill="#818CF8" d="M642,340 H642 A2,2 0 0 1 644,342 V410 A2,2 0 0 1 642,412 H642 A2,2 0 0 1 640,410 V342 A2,2 0 0 1 642,340 Z" />
  <text x="662" y="364" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" fill="#818CF8">③ PR merged</text>
  <text x="662" y="384" font-family="JetBrains Mono, monospace" font-size="11.5" fill="#94A3B8">git branch --show-current == main  OR  $PR_MERGED</text>
  <text x="662" y="402" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#64748B">Pass: archive runs on main branch post-merge</text>

  
  <path fill="#0B0F16" stroke="#2D3748" stroke-width="1" d="M648,422 H1192 A8,8 0 0 1 1200,430 V486 A8,8 0 0 1 1192,494 H648 A8,8 0 0 1 640,486 V430 A8,8 0 0 1 648,422 Z" />
  <path fill="#34D399" d="M642,422 H642 A2,2 0 0 1 644,424 V492 A2,2 0 0 1 642,494 H642 A2,2 0 0 1 640,492 V424 A2,2 0 0 1 642,422 Z" />
  <text x="662" y="446" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" fill="#34D399">④ archive files</text>
  <text x="662" y="466" font-family="JetBrains Mono, monospace" font-size="11.5" fill="#94A3B8">test -f pitfalls.md  &amp;&amp;  grep "DONE" spec.md</text>
  <text x="662" y="484" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#64748B">Pass: pitfalls.md exists + spec.md has DONE status</text>

  
  <path fill="url(#passGrad)" stroke="#34D399" stroke-width="1.5" d="M648,506 H900 A8,8 0 0 1 908,514 V562 A8,8 0 0 1 900,570 H648 A8,8 0 0 1 640,562 V514 A8,8 0 0 1 648,506 Z" />
  <text x="774" y="531" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" fill="#34D399">ALL PASS</text>
  <text x="774" y="551" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#94A3B8">JIRA → Done  +  remotelinks added</text>
  <text x="774" y="567" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#64748B">exit 0</text>

  
  <path fill="url(#failGrad)" stroke="#F87171" stroke-width="1.5" d="M932,506 H1192 A8,8 0 0 1 1200,514 V562 A8,8 0 0 1 1192,570 H932 A8,8 0 0 1 924,562 V514 A8,8 0 0 1 932,506 Z" />
  <text x="1062" y="531" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" fill="#F87171">ANY FAIL</text>
  <text x="1062" y="551" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#94A3B8">JIRA → Blocked  +  comment posted</text>
  <text x="1062" y="567" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#64748B">exit 1 — Jenkins stage fails</text>

  
  <line x1="908" y1="510" x2="908" y2="566" stroke="#2D3748" stroke-width="1.5" stroke-dasharray="4,3" />

  
  <path fill="#1C1F2E" stroke="#2D3748" stroke-width="1" d="M72,638 H1208 A8,8 0 0 1 1216,646 V692 A8,8 0 0 1 1208,700 H72 A8,8 0 0 1 64,692 V646 A8,8 0 0 1 72,638 Z" />
  <text x="640" y="660" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#64748B">JIRA API error (exit 2) is <tspan fill="#F59E0B">non-fatal</tspan> — pipeline continues.  DoD fail (exit 1) is <tspan fill="#F87171">fatal at archive only</tspan> — no other phase blocks on JIRA state.</text>
  <text x="640" y="685" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#475569">Local dev: no JIRA_TOKEN or no jira_key → hook exits 0 silently.  Zero config required for local OpenSpec usage.</text>

  
  <text x="1216" y="714" text-anchor="end" font-family="Inter, system-ui, sans-serif" font-size="14" fill="#64748B">11 / 11</text>
</svg>