  <text x="476" y="414" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" fill="#818CF8">jira_hook.py — called by each opsx command</text>
  <path fill="#0F1117" stroke="#2D3748" stroke-width="1" d="M482,424 H830 A6,6 0 0 1 836,430 V550 A6,6 0 0 1 830,556 H482 A6,6 0 0 1 476,550 V430 A6,6 0 0 1 482,424 Z" />
  <text x="492" y="444" font-family="JetBrains Mono, monospace" font-size="12" fill="#64748B">jira_hook.py &lt;phase&gt; &lt;topic&gt;</text>
  <text x="492" y="464" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#94A3B8">reads: .meta.yaml · eval-log.md · $JIRA_TOKEN</text>
  <text x="492" y="482" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#34D399">exit 0 → success or jira_key absent</text>
  <text x="492" y="500" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#F87171">exit 1 → DoD fail (archive only)</text>
  <text x="492" y="518" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#64748B">exit 2 → JIRA API error (non-fatal)</text>
  <text x="492" y="540" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#64748B">no JIRA_TOKEN → silent skip</text>

  
  <line x1="860" y1="404" x2="860" y2="556" stroke="#2D3748" stroke-width="1" />
  <text x="884" y="414" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" fill="#34D399">Key rules</text>
  <text x="884" y="438" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#94A3B8">• JIRA outage never breaks a build</text>
  <text x="884" y="460" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#94A3B8">• No jira_key → all hooks skip silently</text>
  <text x="884" y="482" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#94A3B8">• Local dev: no token → no JIRA calls</text>
  <text x="884" y="504" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#94A3B8">• Hooks run after phase files written</text>
  <text x="884" y="526" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#94A3B8">• Small track: Spec Review skipped</text>

  
