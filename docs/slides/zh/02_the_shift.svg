<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4F8EF7"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="720" fill="#0F1117"/>

  <rect x="64" y="52" width="4" height="40" fill="url(#titleGrad)" rx="2"/>
  <text x="84" y="80" font-family="PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="36" font-weight="700" fill="#E2E8F0">工程师的角色已经改变</text>

  <!-- BEFORE column -->
  <rect x="64" y="130" width="520" height="480" rx="12" fill="#1C1F2E" stroke="#2D3748" stroke-width="1"/>
  <rect x="64" y="130" width="520" height="52" rx="12" fill="#2D3748"/>
  <rect x="64" y="158" width="520" height="24" fill="#2D3748"/>
  <text x="324" y="158" text-anchor="middle" dominant-baseline="middle" font-family="PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="18" font-weight="600" fill="#94A3B8">之前</text>

  <g transform="translate(96, 210)">
    <circle cx="20" cy="20" r="20" fill="#2D3748"/>
    <text x="20" y="20" text-anchor="middle" dominant-baseline="middle" font-family="PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="16" font-weight="700" fill="#94A3B8">1</text>
    <text x="56" y="14" font-family="PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="18" font-weight="600" fill="#E2E8F0">写代码</text>
    <text x="56" y="36" font-family="PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="14" fill="#64748B">实现是主要工作</text>
    <line x1="20" y1="44" x2="20" y2="80" stroke="#2D3748" stroke-width="2"/>

    <circle cx="20" cy="100" r="20" fill="#2D3748"/>
    <text x="20" y="100" text-anchor="middle" dominant-baseline="middle" font-family="PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="16" font-weight="700" fill="#94A3B8">2</text>
    <text x="56" y="94" font-family="PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="18" font-weight="600" fill="#E2E8F0">调试与测试</text>
    <text x="56" y="116" font-family="PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="14" fill="#64748B">花大量时间调试问题</text>
    <line x1="20" y1="124" x2="20" y2="160" stroke="#2D3748" stroke-width="2"/>

    <circle cx="20" cy="180" r="20" fill="#2D3748"/>
    <text x="20" y="180" text-anchor="middle" dominant-baseline="middle" font-family="PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="16" font-weight="700" fill="#94A3B8">3</text>
    <text x="56" y="174" font-family="PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="18" font-weight="600" fill="#E2E8F0">代码审查</text>
    <text x="56" y="196" font-family="PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="14" fill="#64748B">逐行审查，慢且低效</text>
    <line x1="20" y1="204" x2="20" y2="240" stroke="#2D3748" stroke-width="2"/>

    <circle cx="20" cy="260" r="20" fill="#2D3748"/>
    <text x="20" y="260" text-anchor="middle" dominant-baseline="middle" font-family="PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="16" font-weight="700" fill="#94A3B8">4</text>
    <text x="56" y="254" font-family="PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="18" font-weight="600" fill="#E2E8F0">2-3天交付</text>
    <text x="56" y="276" font-family="PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="14" fill="#64748B">瓶颈 = 编码速度</text>
  </g>

  <rect x="96" y="528" width="220" height="60" rx="8" fill="#2D3748"/>
  <text x="206" y="552" text-anchor="middle" dominant-baseline="middle" font-family="PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="14" fill="#94A3B8">高级工程师 =</text>
  <text x="206" y="572" text-anchor="middle" dominant-baseline="middle" font-family="PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="15" font-weight="600" fill="#E2E8F0">编码最快的人</text>

  <!-- Arrow -->
  <g transform="translate(608, 360)">
    <circle cx="32" cy="0" r="32" fill="#1C1F2E" stroke="#2D3748" stroke-width="1"/>
    <text x="32" y="0" text-anchor="middle" dominant-baseline="middle" font-family="PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="24" fill="#4F8EF7">→</text>
  </g>

  <!-- AFTER column -->
  <rect x="696" y="130" width="520" height="480" rx="12" fill="#1C1F2E" stroke="#4F8EF7" stroke-width="1.5"/>
  <rect x="696" y="130" width="520" height="52" rx="12" fill="#4F8EF7" fill-opacity="0.2"/>
  <rect x="696" y="158" width="520" height="24" fill="#4F8EF7" fill-opacity="0.2"/>
  <text x="956" y="158" text-anchor="middle" dominant-baseline="middle" font-family="PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="18" font-weight="600" fill="#4F8EF7">之后（AI 加速）</text>

  <g transform="translate(728, 210)">
    <circle cx="20" cy="20" r="20" fill="#4F8EF7" fill-opacity="0.2" stroke="#4F8EF7" stroke-width="1"/>
    <text x="20" y="20" text-anchor="middle" dominant-baseline="middle" font-family="PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="16" font-weight="700" fill="#4F8EF7">1</text>
    <text x="56" y="14" font-family="PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="18" font-weight="600" fill="#E2E8F0">编写精准规范</text>
    <text x="56" y="36" font-family="PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="14" fill="#94A3B8">规范质量 = 输出质量</text>
    <line x1="20" y1="44" x2="20" y2="80" stroke="#4F8EF7" stroke-width="2" stroke-opacity="0.3"/>

    <circle cx="20" cy="100" r="20" fill="#818CF8" fill-opacity="0.2" stroke="#818CF8" stroke-width="1"/>
    <text x="20" y="100" text-anchor="middle" dominant-baseline="middle" font-family="PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="16" font-weight="700" fill="#818CF8">2</text>
    <text x="56" y="94" font-family="PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="18" font-weight="600" fill="#E2E8F0">Claude 执行</text>
    <text x="56" y="116" font-family="PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="14" fill="#94A3B8">TDD + 评测框架自动运行</text>
    <line x1="20" y1="124" x2="20" y2="160" stroke="#818CF8" stroke-width="2" stroke-opacity="0.3"/>

    <circle cx="20" cy="180" r="20" fill="#34D399" fill-opacity="0.2" stroke="#34D399" stroke-width="1"/>
    <text x="20" y="180" text-anchor="middle" dominant-baseline="middle" font-family="PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="16" font-weight="700" fill="#34D399">3</text>
    <text x="56" y="174" font-family="PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="18" font-weight="600" fill="#E2E8F0">审查规范保真度</text>
    <text x="56" y="196" font-family="PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="14" fill="#94A3B8">Claude 构建的是正确的东西吗？</text>
    <line x1="20" y1="204" x2="20" y2="240" stroke="#34D399" stroke-width="2" stroke-opacity="0.3"/>

    <circle cx="20" cy="260" r="20" fill="#34D399" fill-opacity="0.2" stroke="#34D399" stroke-width="1"/>
    <text x="20" y="260" text-anchor="middle" dominant-baseline="middle" font-family="PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="16" font-weight="700" fill="#34D399">4</text>
    <text x="56" y="254" font-family="PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="18" font-weight="600" fill="#E2E8F0">小时级交付</text>
    <text x="56" y="276" font-family="PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="14" fill="#94A3B8">瓶颈 = 规范质量 + 判断力</text>
  </g>

  <rect x="728" y="528" width="220" height="60" rx="8" fill="#4F8EF7" fill-opacity="0.15" stroke="#4F8EF7" stroke-width="1"/>
  <text x="838" y="552" text-anchor="middle" dominant-baseline="middle" font-family="PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="14" fill="#94A3B8">高级工程师 =</text>
  <text x="838" y="572" text-anchor="middle" dominant-baseline="middle" font-family="PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="15" font-weight="600" fill="#4F8EF7">最优秀的规范撰写者</text>

  <!-- Bottom quote -->
  <rect x="64" y="638" width="1152" height="52" rx="8" fill="#1C1F2E" stroke="#2D3748" stroke-width="1"/>
  <text x="640" y="664" text-anchor="middle" dominant-baseline="middle" font-family="PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="17" font-style="italic" fill="#94A3B8">"速度不再是约束。</text>
  <text x="640" y="664" text-anchor="middle" dominant-baseline="middle" font-family="PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="17" font-style="italic" fill="#E2E8F0">          判断力才是稀缺资源。"</text>

  <text x="1216" y="700" text-anchor="end" font-family="PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="14" fill="#64748B">2 / 11</text>
</svg>
