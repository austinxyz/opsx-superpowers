<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4F8EF7"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
    <linearGradient id="exploreGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4F8EF7" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#4F8EF7" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="proposeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#818CF8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="applyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34D399" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#34D399" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="archiveGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0.05"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="720" fill="#0F1117"/>

  <rect x="64" y="52" width="4" height="40" fill="url(#titleGrad)" rx="2"/>
  <text x="84" y="80" font-family="PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="36" font-weight="700" fill="#E2E8F0">四个阶段，硬边界</text>
  <text x="84" y="112" font-family="PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="15" fill="#94A3B8">每个阶段是硬边界 — 不可跳过。每个阶段的输出是下一阶段的输入。</text>

  <!-- Phase 1: Explore -->
  <rect x="64" y="148" width="256" height="440" rx="12" fill="url(#exploreGrad)" stroke="#4F8EF7" stroke-width="1.5"/>
  <text x="192" y="206" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="44">🔍</text>
  <text x="192" y="248" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="22" font-weight="700" fill="#4F8EF7">探索</text>
  <rect x="88" y="264" width="208" height="2" fill="#2D3748"/>
  <text x="192" y="296" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="14" fill="#94A3B8">将粗略想法转化为</text>
  <text x="192" y="316" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="14" fill="#94A3B8">评审后的需求</text>
  <rect x="88" y="370" width="208" height="92" rx="8" fill="#1C1F2E" stroke="#2D3748" stroke-width="1"/>
  <text x="192" y="396" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="12" fill="#64748B">输出</text>
  <text x="192" y="420" text-anchor="middle" font-family="JetBrains Mono, Consolas, monospace" font-size="13" fill="#34D399">requirements.md</text>
  <text x="192" y="440" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="12" fill="#64748B">状态：已评审</text>
  <rect x="88" y="492" width="208" height="72" rx="8" fill="#F87171" fill-opacity="0.1" stroke="#F87171" stroke-width="1"/>
  <text x="192" y="516" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="12" font-weight="600" fill="#F87171">⛔ 门控</text>
  <text x="192" y="536" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="12" fill="#94A3B8">状态：草稿</text>
  <text x="192" y="552" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="12" fill="#94A3B8">阻止提议阶段</text>

  <g transform="translate(332, 360)">
    <line x1="0" y1="0" x2="32" y2="0" stroke="#4F8EF7" stroke-width="2"/>
    <polygon points="28,-6 40,0 28,6" fill="#4F8EF7"/>
  </g>

  <!-- Phase 2: Propose -->
  <rect x="384" y="148" width="256" height="440" rx="12" fill="url(#proposeGrad)" stroke="#818CF8" stroke-width="1.5"/>
  <text x="512" y="206" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="44">📋</text>
  <text x="512" y="248" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="22" font-weight="700" fill="#818CF8">提议</text>
  <rect x="408" y="264" width="208" height="2" fill="#2D3748"/>
  <text x="512" y="296" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="14" fill="#94A3B8">将需求转化为</text>
  <text x="512" y="316" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="14" fill="#94A3B8">完整 OpenSpec 变更</text>
  <rect x="408" y="370" width="208" height="92" rx="8" fill="#1C1F2E" stroke="#2D3748" stroke-width="1"/>
  <text x="512" y="393" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="12" fill="#64748B">输出</text>
  <text x="512" y="413" text-anchor="middle" font-family="JetBrains Mono, Consolas, monospace" font-size="12" fill="#34D399">proposal.md</text>
  <text x="512" y="430" text-anchor="middle" font-family="JetBrains Mono, Consolas, monospace" font-size="12" fill="#34D399">design.md</text>
  <text x="512" y="447" text-anchor="middle" font-family="JetBrains Mono, Consolas, monospace" font-size="12" fill="#34D399">tasks.md</text>
  <rect x="408" y="492" width="208" height="72" rx="8" fill="#F87171" fill-opacity="0.1" stroke="#F87171" stroke-width="1"/>
  <text x="512" y="516" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="12" font-weight="600" fill="#F87171">⛔ 门控</text>
  <text x="512" y="536" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="12" fill="#94A3B8">无 requirements.md</text>
  <text x="512" y="552" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="12" fill="#94A3B8">阻止执行阶段</text>

  <g transform="translate(652, 360)">
    <line x1="0" y1="0" x2="32" y2="0" stroke="#818CF8" stroke-width="2"/>
    <polygon points="28,-6 40,0 28,6" fill="#818CF8"/>
  </g>

  <!-- Phase 3: Apply -->
  <rect x="704" y="148" width="256" height="440" rx="12" fill="url(#applyGrad)" stroke="#34D399" stroke-width="1.5"/>
  <text x="832" y="206" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="44">⚙️</text>
  <text x="832" y="248" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="22" font-weight="700" fill="#34D399">执行</text>
  <rect x="728" y="264" width="208" height="2" fill="#2D3748"/>
  <text x="832" y="296" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="14" fill="#94A3B8">TDD + 评测框架</text>
  <text x="832" y="316" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="14" fill="#94A3B8">驱动实现</text>
  <rect x="728" y="370" width="208" height="92" rx="8" fill="#1C1F2E" stroke="#2D3748" stroke-width="1"/>
  <text x="832" y="393" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="12" fill="#64748B">输出</text>
  <text x="832" y="413" text-anchor="middle" font-family="JetBrains Mono, Consolas, monospace" font-size="12" fill="#34D399">code changes</text>
  <text x="832" y="430" text-anchor="middle" font-family="JetBrains Mono, Consolas, monospace" font-size="12" fill="#34D399">eval-log.md</text>
  <text x="832" y="447" text-anchor="middle" font-family="JetBrains Mono, Consolas, monospace" font-size="12" fill="#34D399">PR ready</text>
  <rect x="728" y="492" width="208" height="72" rx="8" fill="#34D399" fill-opacity="0.1" stroke="#34D399" stroke-width="1"/>
  <text x="832" y="516" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="12" font-weight="600" fill="#34D399">✅ 门控</text>
  <text x="832" y="536" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="12" fill="#94A3B8">所有评测通过</text>
  <text x="832" y="552" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="12" fill="#94A3B8">CI 绿色 + PR 批准</text>

  <g transform="translate(972, 360)">
    <line x1="0" y1="0" x2="32" y2="0" stroke="#34D399" stroke-width="2"/>
    <polygon points="28,-6 40,0 28,6" fill="#34D399"/>
  </g>

  <!-- Phase 4: Archive -->
  <rect x="1024" y="148" width="192" height="440" rx="12" fill="url(#archiveGrad)" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="1120" y="206" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="44">📦</text>
  <text x="1120" y="248" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="22" font-weight="700" fill="#F59E0B">归档</text>
  <rect x="1044" y="264" width="152" height="2" fill="#2D3748"/>
  <text x="1120" y="296" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="13" fill="#94A3B8">归档变更 +</text>
  <text x="1120" y="316" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="13" fill="#94A3B8">更新能力规范</text>
  <text x="1120" y="336" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="13" fill="#94A3B8">与陷阱记录</text>
  <rect x="1044" y="370" width="152" height="92" rx="8" fill="#1C1F2E" stroke="#2D3748" stroke-width="1"/>
  <text x="1120" y="393" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="12" fill="#64748B">输出</text>
  <text x="1120" y="413" text-anchor="middle" font-family="JetBrains Mono, Consolas, monospace" font-size="11" fill="#34D399">spec.md updated</text>
  <text x="1120" y="430" text-anchor="middle" font-family="JetBrains Mono, Consolas, monospace" font-size="11" fill="#34D399">pitfalls.md</text>
  <text x="1120" y="447" text-anchor="middle" font-family="JetBrains Mono, Consolas, monospace" font-size="11" fill="#34D399">CLAUDE.md</text>
  <rect x="1044" y="492" width="152" height="72" rx="8" fill="#34D399" fill-opacity="0.15" stroke="#34D399" stroke-width="1"/>
  <text x="1120" y="524" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="22">🎯</text>
  <text x="1120" y="552" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="14" font-weight="600" fill="#34D399">达成</text>

  <text x="1216" y="700" text-anchor="end" font-family="PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="14" fill="#64748B">3 / 11</text>
</svg>
