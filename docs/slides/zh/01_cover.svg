<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4F8EF7"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F1117"/>
      <stop offset="100%" stop-color="#131929"/>
    </linearGradient>
    <radialGradient id="glowLeft" cx="15%" cy="60%" r="40%">
      <stop offset="0%" stop-color="#4F8EF7" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#4F8EF7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowRight" cx="85%" cy="35%" r="40%">
      <stop offset="0%" stop-color="#818CF8" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="720" fill="url(#bgGrad)"/>
  <rect width="1280" height="720" fill="url(#glowLeft)"/>
  <rect width="1280" height="720" fill="url(#glowRight)"/>

  <!-- Left accent bar -->
  <rect x="64" y="200" width="4" height="280" fill="url(#titleGrad)" rx="2"/>

  <!-- Phase pill row -->
  <g id="phase-pills" transform="translate(84, 170)">
    <rect x="0" y="0" width="88" height="28" rx="14" fill="#1C1F2E" stroke="#2D3748" stroke-width="1"/>
    <text x="44" y="14" text-anchor="middle" dominant-baseline="middle" font-family="PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="13" fill="#94A3B8">🔍 探索</text>

    <text x="105" y="14" text-anchor="middle" dominant-baseline="middle" font-family="PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="13" fill="#2D3748">→</text>

    <rect x="120" y="0" width="88" height="28" rx="14" fill="#1C1F2E" stroke="#2D3748" stroke-width="1"/>
    <text x="164" y="14" text-anchor="middle" dominant-baseline="middle" font-family="PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="13" fill="#94A3B8">📋 提议</text>

    <text x="225" y="14" text-anchor="middle" dominant-baseline="middle" font-family="PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="13" fill="#2D3748">→</text>

    <rect x="240" y="0" width="80" height="28" rx="14" fill="#1C1F2E" stroke="#2D3748" stroke-width="1"/>
    <text x="280" y="14" text-anchor="middle" dominant-baseline="middle" font-family="PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="13" fill="#94A3B8">⚙️ 执行</text>

    <text x="337" y="14" text-anchor="middle" dominant-baseline="middle" font-family="PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="13" fill="#2D3748">→</text>

    <rect x="352" y="0" width="88" height="28" rx="14" fill="#1C1F2E" stroke="#2D3748" stroke-width="1"/>
    <text x="396" y="14" text-anchor="middle" dominant-baseline="middle" font-family="PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="13" fill="#94A3B8">📦 归档</text>
  </g>

  <!-- Main title -->
  <text x="88" y="268" font-family="PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="48" font-weight="700" fill="url(#titleGrad)">多工程师</text>
  <text x="88" y="334" font-family="PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="48" font-weight="700" fill="#E2E8F0">OpenSpec 工作流</text>

  <!-- Divider -->
  <rect x="88" y="358" width="320" height="2" fill="#2D3748" rx="1"/>

  <!-- Subtitle -->
  <text x="88" y="396" font-family="PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="20" fill="#94A3B8">规范质量 = 交付质量</text>

  <!-- Key stats row -->
  <g id="stats" transform="translate(88, 450)">
    <rect x="0" y="0" width="148" height="68" rx="8" fill="#1C1F2E" stroke="#2D3748" stroke-width="1"/>
    <text x="74" y="26" text-anchor="middle" dominant-baseline="middle" font-family="PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="28" font-weight="700" fill="#4F8EF7">2-6</text>
    <text x="74" y="52" text-anchor="middle" dominant-baseline="middle" font-family="PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="13" fill="#94A3B8">工程师</text>

    <rect x="164" y="0" width="148" height="68" rx="8" fill="#1C1F2E" stroke="#2D3748" stroke-width="1"/>
    <text x="238" y="26" text-anchor="middle" dominant-baseline="middle" font-family="PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="28" font-weight="700" fill="#34D399">4</text>
    <text x="238" y="52" text-anchor="middle" dominant-baseline="middle" font-family="PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="13" fill="#94A3B8">阶段</text>

    <rect x="328" y="0" width="148" height="68" rx="8" fill="#1C1F2E" stroke="#2D3748" stroke-width="1"/>
    <text x="402" y="26" text-anchor="middle" dominant-baseline="middle" font-family="PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="28" font-weight="700" fill="#818CF8">0</text>
    <text x="402" y="52" text-anchor="middle" dominant-baseline="middle" font-family="PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="13" fill="#94A3B8">跳过的门控</text>
  </g>

  <!-- Right decorative -->
  <g opacity="0.15" stroke="#4F8EF7" stroke-width="1" fill="none">
    <rect x="820" y="120" width="320" height="200" rx="8" stroke="#2D3748"/>
    <rect x="840" y="140" width="140" height="36" rx="4" stroke="#4F8EF7"/>
    <rect x="840" y="188" width="200" height="36" rx="4" stroke="#818CF8"/>
    <rect x="840" y="236" width="100" height="36" rx="4" stroke="#34D399"/>
    <line x1="980" y1="158" x2="1020" y2="158"/>
    <line x1="1040" y1="206" x2="1080" y2="206"/>
    <circle cx="1100" cy="158" r="12" stroke="#4F8EF7"/>
    <circle cx="1120" cy="254" r="8" stroke="#34D399"/>
  </g>

  <!-- Code snippet decoration -->
  <g transform="translate(820, 360)">
    <rect width="360" height="180" rx="8" fill="#1C1F2E" stroke="#2D3748" stroke-width="1"/>
    <rect width="360" height="32" rx="8" fill="#2D3748"/>
    <rect width="360" height="24" y="8" fill="#2D3748"/>
    <circle cx="16" cy="16" r="5" fill="#F87171"/>
    <circle cx="36" cy="16" r="5" fill="#FBBF24"/>
    <circle cx="56" cy="16" r="5" fill="#34D399"/>
    <text x="16" y="62" font-family="JetBrains Mono, Consolas, monospace" font-size="13" fill="#94A3B8">/opsx:explore auth-refactor</text>
    <text x="16" y="86" font-family="JetBrains Mono, Consolas, monospace" font-size="13" fill="#4F8EF7">/opsx:propose auth-refactor</text>
    <text x="16" y="110" font-family="JetBrains Mono, Consolas, monospace" font-size="13" fill="#818CF8">/opsx:apply auth-refactor</text>
    <text x="16" y="134" font-family="JetBrains Mono, Consolas, monospace" font-size="13" fill="#34D399">/opsx:archive auth-refactor</text>
    <text x="16" y="162" font-family="JetBrains Mono, Consolas, monospace" font-size="13" fill="#64748B">✓ 达成</text>
  </g>

  <!-- Slide number -->
  <text x="1216" y="700" text-anchor="end" font-family="PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="14" fill="#64748B">1 / 11</text>
</svg>
