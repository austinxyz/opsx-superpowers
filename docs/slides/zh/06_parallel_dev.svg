<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4F8EF7"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="720" fill="#0F1117"/>

  <!-- Title -->
  <rect x="64" y="36" width="4" height="40" fill="url(#titleGrad)" rx="2"/>
  <text x="84" y="64" font-family="PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="32" font-weight="700" fill="#E2E8F0">提议阶段的冲突检测</text>

  <!-- Main principle badge -->
  <rect x="64" y="88" width="1152" height="44" rx="8" fill="#4F8EF7" fill-opacity="0.1" stroke="#4F8EF7" stroke-width="1"/>
  <text x="640" y="110" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="17" font-weight="600" fill="#4F8EF7">规则：一个工程师 · 一个主题 · 端到端 — 在规范阶段发现冲突，而非合并时</text>

  <!-- Flow node 1: Propose Phase -->
  <rect x="420" y="156" width="400" height="56" rx="28" fill="#1C1F2E" stroke="#818CF8" stroke-width="2"/>
  <text x="620" y="184" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="16" font-weight="600" fill="#818CF8">📋 提议阶段</text>
  <text x="840" y="184" font-family="PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="13" fill="#94A3B8">新主题启动</text>

  <!-- Arrow 1→2 -->
  <line x1="640" y1="212" x2="640" y2="244" stroke="#4F8EF7" stroke-width="2"/>
  <polygon points="634,241 640,252 646,241" fill="#4F8EF7"/>

  <!-- Flow node 2: Read active branches -->
  <rect x="380" y="252" width="520" height="64" rx="8" fill="#1C1F2E" stroke="#4F8EF7" stroke-width="1.5"/>
  <text x="640" y="276" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="15" font-weight="600" fill="#E2E8F0">🔍 读取活跃分支 + 提议</text>
  <text x="640" y="300" text-anchor="middle" font-family="JetBrains Mono, Consolas, monospace" font-size="12" fill="#94A3B8">git branch -r · 扫描 proposal.md + design.md 文件</text>

  <!-- Arrow 2→diamond -->
  <line x1="640" y1="316" x2="640" y2="348" stroke="#4F8EF7" stroke-width="2"/>
  <polygon points="634,345 640,356 646,345" fill="#4F8EF7"/>

  <!-- Diamond: Interface overlap? -->
  <polygon points="640,356 780,404 640,452 500,404" fill="#1C1F2E" stroke="#F59E0B" stroke-width="2"/>
  <text x="640" y="396" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="14" font-weight="600" fill="#E2E8F0">接口</text>
  <text x="640" y="416" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="14" font-weight="600" fill="#E2E8F0">重叠？</text>

  <!-- Label YES on left -->
  <text x="426" y="396" text-anchor="end" font-family="PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="13" fill="#F87171">是</text>

  <!-- Label NO on right -->
  <text x="856" y="396" text-anchor="start" font-family="PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="13" fill="#34D399">否</text>

  <!-- Left branch: YES → Sequence -->
  <line x1="500" y1="404" x2="240" y2="404" stroke="#F87171" stroke-width="1.5"/>
  <line x1="240" y1="404" x2="240" y2="488" stroke="#F87171" stroke-width="1.5"/>
  <polygon points="234,485 240,496 246,485" fill="#F87171"/>

  <!-- Left leaf: Sequence -->
  <rect x="80" y="496" width="320" height="80" rx="8" fill="#1C1F2E" stroke="#F87171" stroke-width="1.5"/>
  <text x="240" y="524" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="15" font-weight="700" fill="#F87171">🔗 顺序执行</text>
  <text x="240" y="548" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="13" fill="#E2E8F0">在 design.md 中声明 depends_on</text>
  <text x="240" y="566" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="12" fill="#94A3B8">等待接口 PR 先合并</text>

  <!-- Right branch: NO → Parallelize -->
  <line x1="780" y1="404" x2="1040" y2="404" stroke="#34D399" stroke-width="1.5"/>
  <line x1="1040" y1="404" x2="1040" y2="488" stroke="#34D399" stroke-width="1.5"/>
  <polygon points="1034,485 1040,496 1046,485" fill="#34D399"/>

  <!-- Right leaf: Parallelize -->
  <rect x="880" y="496" width="320" height="80" rx="8" fill="#1C1F2E" stroke="#34D399" stroke-width="1.5"/>
  <text x="1040" y="524" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="15" font-weight="700" fill="#34D399">⚡ 并行执行</text>
  <text x="1040" y="548" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="13" fill="#E2E8F0">无共享接口依赖</text>
  <text x="1040" y="566" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="12" fill="#94A3B8">可立即开始</text>

  <!-- Bottom key rule -->
  <rect x="64" y="608" width="1152" height="52" rx="8" fill="#1C1F2E" stroke="#2D3748" stroke-width="1"/>
  <text x="80" y="634" font-family="PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="14" fill="#64748B">关键规则：</text>
  <text x="168" y="634" font-family="PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="15" font-weight="600" fill="#E2E8F0">接口必须锁定（接口 PR 合并后）才能开始并行实现</text>

  <!-- Slide number -->
  <text x="1216" y="700" text-anchor="end" font-family="PingFang SC, Microsoft YaHei, system-ui, sans-serif" font-size="14" fill="#64748B">6 / 11</text>
</svg>
