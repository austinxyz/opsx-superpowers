  <rect x="258" y="290" width="132" height="1" fill="#2D3748"/>
  <text x="324" y="308" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600" fill="#818CF8">LINKS ADDED</text>
  <text x="324" y="326" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#94A3B8">proposal.md</text>
  <text x="324" y="342" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#94A3B8">design.md · tasks.md</text>

  <!-- Connector -->
  <line x1="324" y1="156" x2="324" y2="236" stroke="#818CF8" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- Card 3: Spec Review -->
  <rect x="428" y="236" width="160" height="120" rx="8" fill="#1C1F2E" stroke="#F59E0B" stroke-width="1"/>
  <text x="508" y="258" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600" fill="#F59E0B">TRIGGER</text>
  <text x="508" y="276" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#94A3B8">PR1 opens (large track)</text>
  <rect x="440" y="290" width="132" height="1" fill="#2D3748"/>
  <text x="508" y="308" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600" fill="#F59E0B">ACTION</text>
  <text x="508" y="326" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#94A3B8">spec-locked label set</text>
  <text x="508" y="344" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#64748B">small track: skipped</text>

  <!-- Connector -->
  <line x1="508" y1="156" x2="508" y2="236" stroke="#F59E0B" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- Card 4: Applying -->
  <rect x="614" y="236" width="156" height="120" rx="8" fill="#1C1F2E" stroke="#34D399" stroke-width="1"/>
  <text x="692" y="258" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600" fill="#34D399">TRIGGER</text>
  <text x="692" y="276" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" fill="#34D399">opsx apply</text>
  <rect x="626" y="290" width="132" height="1" fill="#2D3748"/>
  <text x="692" y="308" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600" fill="#34D399">LINK ADDED</text>
  <text x="692" y="326" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#94A3B8">eval-log.md (live)</text>
  <text x="692" y="344" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#64748B">Jenkins agent</text>

  <!-- Connector -->
  <line x1="692" y1="156" x2="692" y2="236" stroke="#34D399" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- Card 5: In Review -->
  <rect x="796" y="236" width="156" height="120" rx="8" fill="#1C1F2E" stroke="#F59E0B" stroke-width="1"/>
  <text x="874" y="258" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600" fill="#F59E0B">TRIGGER</text>
