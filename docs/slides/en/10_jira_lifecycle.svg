  <text x="142" y="326" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#94A3B8">requirements.md</text>
  <text x="142" y="344" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#64748B">local or Jenkins</text>

  <!-- Connector -->
  <line x1="142" y1="156" x2="142" y2="236" stroke="#4F8EF7" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- Card 2: Proposing -->
  <rect x="246" y="236" width="156" height="120" rx="8" fill="#1C1F2E" stroke="#818CF8" stroke-width="1"/>
  <text x="324" y="258" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600" fill="#818CF8">TRIGGER</text>
