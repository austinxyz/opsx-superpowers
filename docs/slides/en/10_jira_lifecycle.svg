  <rect x="808" y="290" width="132" height="1" fill="#2D3748"/>
  <text x="874" y="308" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600" fill="#F59E0B">LINK ADDED</text>
  <text x="874" y="326" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#94A3B8">PR URL</text>
  <text x="874" y="344" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#64748B">Jenkins post-build</text>

  <!-- Connector -->
  <line x1="874" y1="156" x2="874" y2="236" stroke="#F59E0B" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- Card 6: Done -->
  <rect x="978" y="236" width="238" height="120" rx="8" fill="#1C1F2E" stroke="#34D399" stroke-width="1.5"/>
  <text x="1097" y="258" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600" fill="#34D399">TRIGGER</text>
  <text x="1097" y="276" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" fill="#34D399">opsx archive (DoD pass)</text>
  <rect x="990" y="290" width="214" height="1" fill="#2D3748"/>
  <text x="1097" y="308" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600" fill="#34D399">LINKS ADDED</text>
  <text x="1097" y="326" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#94A3B8">pitfalls.md · spec archived</text>
  <text x="1097" y="344" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#64748B">JIRA Done transition unlocked</text>

  <!-- Connector -->
  <line x1="1038" y1="156" x2="1038" y2="236" stroke="#34D399" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- Blocked card -->
  <rect x="612" y="228" width="160" height="8" fill="#0F1117"/>
  <!-- (overlap fix: Blocked is lower, card starts below) -->

  <!-- Bottom section: how it works -->
  <rect x="64" y="388" width="1152" height="180" rx="12" fill="#1C1F2E" stroke="#2D3748" stroke-width="1"/>

  <!-- Left: .meta.yaml -->
  <text x="88" y="414" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" fill="#4F8EF7">openspec/topics/auth-refactor/.meta.yaml</text>
  <rect x="88" y="424" width="340" height="132" rx="6" fill="#0F1117" stroke="#2D3748" stroke-width="1"/>
  <text x="104" y="444" font-family="JetBrains Mono, monospace" font-size="12" fill="#94A3B8">topic: auth-refactor</text>
  <text x="104" y="462" font-family="JetBrains Mono, monospace" font-size="12" fill="#F59E0B">jira_key: PROJ-123</text>
  <text x="104" y="480" font-family="JetBrains Mono, monospace" font-size="12" fill="#94A3B8">jira_project: PROJ</text>
  <text x="104" y="498" font-family="JetBrains Mono, monospace" font-size="12" fill="#94A3B8">track: large</text>
  <text x="104" y="516" font-family="JetBrains Mono, monospace" font-size="12" fill="#34D399">phase: applying</text>
  <text x="104" y="534" font-family="JetBrains Mono, monospace" font-size="12" fill="#64748B">pr1_url: https://git/...</text>

  <!-- Center: hook interface -->
  <line x1="452" y1="404" x2="452" y2="556" stroke="#2D3748" stroke-width="1"/>
  <text x="476" y="414" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" fill="#818CF8">jira_hook.py — called by each opsx command</text>
  <rect x="476" y="424" width="360" height="132" rx="6" fill="#0F1117" stroke="#2D3748" stroke-width="1"/>
  <text x="492" y="444" font-family="JetBrains Mono, monospace" font-size="12" fill="#64748B">jira_hook.py &lt;phase&gt; &lt;topic&gt;</text>
  <text x="492" y="464" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#94A3B8">reads: .meta.yaml · eval-log.md · $JIRA_TOKEN</text>
  <text x="492" y="482" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#34D399">exit 0 → success or jira_key absent</text>
  <text x="492" y="500" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#F87171">exit 1 → DoD fail (archive only)</text>
  <text x="492" y="518" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#64748B">exit 2 → JIRA API error (non-fatal)</text>
  <text x="492" y="540" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#64748B">no JIRA_TOKEN → silent skip</text>

  <!-- Right: key rules -->
  <line x1="860" y1="404" x2="860" y2="556" stroke="#2D3748" stroke-width="1"/>
  <text x="884" y="414" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" fill="#34D399">Key rules</text>
  <text x="884" y="438" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#94A3B8">• JIRA outage never breaks a build</text>
  <text x="884" y="460" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#94A3B8">• No jira_key → all hooks skip silently</text>
  <text x="884" y="482" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#94A3B8">• Local dev: no token → no JIRA calls</text>
  <text x="884" y="504" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#94A3B8">• Hooks run after phase files written</text>
  <text x="884" y="526" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#94A3B8">• Small track: Spec Review skipped</text>

  <!-- Bottom bar -->
  <rect x="64" y="588" width="1152" height="44" rx="8" fill="#0F1117" stroke="#2D3748" stroke-width="1"/>
  <text x="640" y="610" text-anchor="middle" dominant-baseline="middle" font-family="Inter, system-ui, sans-serif" font-size="14" fill="#94A3B8">Supports both flows: JIRA-first (PM creates ticket → engineer sets jira_key) and OpenSpec-first (engineer starts spec → links ticket later)</text>

  <!-- Slide number -->
  <text x="1216" y="700" text-anchor="end" font-family="Inter, system-ui, sans-serif" font-size="14" fill="#64748B">10 / 11</text>
</svg>
