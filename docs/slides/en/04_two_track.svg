<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4F8EF7"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="720" fill="#0F1117"/>

  <!-- Title -->
  <rect x="64" y="36" width="4" height="36" fill="url(#titleGrad)" rx="2"/>
  <text x="84" y="60" font-family="Inter, system-ui, sans-serif" font-size="32" font-weight="700" fill="#E2E8F0">Two-Track Branch Strategy</text>

  <!-- Decision node: New Topic -->
  <rect x="520" y="96" width="240" height="52" rx="26" fill="#1C1F2E" stroke="#4F8EF7" stroke-width="2"/>
  <text x="640" y="122" text-anchor="middle" dominant-baseline="middle" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="600" fill="#E2E8F0">🚀 New Topic</text>

  <!-- Arrow down -->
  <line x1="640" y1="148" x2="640" y2="176" stroke="#4F8EF7" stroke-width="2"/>

  <!-- Decision diamond -->
  <polygon points="640,176 760,220 640,264 520,220" fill="#1C1F2E" stroke="#4F8EF7" stroke-width="2"/>
  <text x="640" y="214" text-anchor="middle" dominant-baseline="middle" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="600" fill="#E2E8F0">Small</text>
  <text x="640" y="232" text-anchor="middle" dominant-baseline="middle" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="600" fill="#E2E8F0">or Large?</text>

  <!-- Left branch: Small -->
  <line x1="520" y1="220" x2="280" y2="220" stroke="#4F8EF7" stroke-width="2"/>
  <line x1="280" y1="220" x2="280" y2="280" stroke="#4F8EF7" stroke-width="2"/>
  <text x="400" y="208" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#94A3B8">≤2 days · single module</text>

  <!-- Right branch: Large -->
  <line x1="760" y1="220" x2="980" y2="220" stroke="#818CF8" stroke-width="2"/>
  <line x1="980" y1="220" x2="980" y2="280" stroke="#818CF8" stroke-width="2"/>
  <text x="870" y="208" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#94A3B8">≥3 days · arch · cross-module</text>

  <!-- SMALL TRACK -->
  <text x="280" y="268" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" fill="#4F8EF7">SMALL TRACK</text>

  <!-- Small: feat/topic -->
  <rect x="148" y="280" width="264" height="44" rx="8" fill="#1C1F2E" stroke="#4F8EF7" stroke-width="1.5"/>
  <text x="280" y="302" text-anchor="middle" dominant-baseline="middle" font-family="JetBrains Mono, monospace" font-size="15" fill="#4F8EF7">feat/&lt;topic&gt;</text>
  <line x1="280" y1="324" x2="280" y2="356" stroke="#4F8EF7" stroke-width="2"/>

  <!-- Small: Apply -->
  <rect x="148" y="356" width="264" height="44" rx="8" fill="#1C1F2E" stroke="#34D399" stroke-width="1.5"/>
  <text x="280" y="378" text-anchor="middle" dominant-baseline="middle" font-family="Inter, system-ui, sans-serif" font-size="15" fill="#34D399">⚙️ Apply (TDD + Eval)</text>
  <line x1="280" y1="400" x2="280" y2="432" stroke="#34D399" stroke-width="2"/>

  <!-- Small: Archive -->
  <rect x="148" y="432" width="264" height="44" rx="8" fill="#1C1F2E" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="280" y="454" text-anchor="middle" dominant-baseline="middle" font-family="Inter, system-ui, sans-serif" font-size="15" fill="#F59E0B">📦 Archive on branch</text>
  <line x1="280" y1="476" x2="280" y2="508" stroke="#F59E0B" stroke-width="2"/>

  <!-- Small: 1 PR -->
  <rect x="148" y="508" width="264" height="44" rx="8" fill="#1C1F2E" stroke="#818CF8" stroke-width="1.5"/>
  <text x="280" y="530" text-anchor="middle" dominant-baseline="middle" font-family="Inter, system-ui, sans-serif" font-size="15" fill="#818CF8">👥 1 PR — Spec + Code</text>
  <line x1="280" y1="552" x2="280" y2="584" stroke="#818CF8" stroke-width="2"/>

  <!-- Small: Achieve -->
  <rect x="164" y="584" width="232" height="48" rx="24" fill="#34D399" fill-opacity="0.2" stroke="#34D399" stroke-width="2"/>
  <text x="280" y="608" text-anchor="middle" dominant-baseline="middle" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="700" fill="#34D399">🎯 Achieve</text>

  <!-- Small track label -->
  <rect x="76" y="268" width="420" height="388" rx="12" fill="none" stroke="#4F8EF7" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- LARGE TRACK -->
  <text x="980" y="268" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" fill="#818CF8">LARGE TRACK</text>

  <!-- Large: spec/topic -->
  <rect x="848" y="280" width="264" height="44" rx="8" fill="#1C1F2E" stroke="#818CF8" stroke-width="1.5"/>
  <text x="980" y="302" text-anchor="middle" dominant-baseline="middle" font-family="JetBrains Mono, monospace" font-size="14" fill="#818CF8">spec/&lt;topic&gt; branch</text>
  <line x1="980" y1="324" x2="980" y2="356" stroke="#818CF8" stroke-width="2"/>

  <!-- Large: PR1 Spec Review -->
  <rect x="848" y="356" width="264" height="44" rx="8" fill="#818CF8" fill-opacity="0.15" stroke="#818CF8" stroke-width="1.5"/>
  <text x="980" y="378" text-anchor="middle" dominant-baseline="middle" font-family="Inter, system-ui, sans-serif" font-size="15" fill="#818CF8">👥 PR1 — Spec Review</text>
  <line x1="980" y1="400" x2="980" y2="432" stroke="#818CF8" stroke-width="2"/>

  <!-- Large: feat/topic -->
  <rect x="848" y="432" width="264" height="44" rx="8" fill="#1C1F2E" stroke="#4F8EF7" stroke-width="1.5"/>
  <text x="980" y="454" text-anchor="middle" dominant-baseline="middle" font-family="JetBrains Mono, monospace" font-size="14" fill="#4F8EF7">feat/&lt;topic&gt; branch</text>
  <line x1="980" y1="476" x2="980" y2="508" stroke="#4F8EF7" stroke-width="2"/>

  <!-- Large: Apply + Archive -->
  <rect x="848" y="508" width="264" height="44" rx="8" fill="#1C1F2E" stroke="#34D399" stroke-width="1.5"/>
  <text x="980" y="530" text-anchor="middle" dominant-baseline="middle" font-family="Inter, system-ui, sans-serif" font-size="14" fill="#34D399">⚙️ Apply + 📦 Archive</text>
  <line x1="980" y1="552" x2="980" y2="584" stroke="#34D399" stroke-width="2"/>

  <!-- Large: PR2 Impl Review -->
  <rect x="848" y="584" width="264" height="44" rx="8" fill="#4F8EF7" fill-opacity="0.15" stroke="#4F8EF7" stroke-width="1.5"/>
  <text x="980" y="606" text-anchor="middle" dominant-baseline="middle" font-family="Inter, system-ui, sans-serif" font-size="14" fill="#4F8EF7">👥 PR2 — Impl Review → 🎯</text>

  <!-- Large track label -->
  <rect x="776" y="268" width="420" height="388" rx="12" fill="none" stroke="#818CF8" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- Bottom note -->
  <rect x="64" y="668" width="720" height="36" rx="6" fill="#1C1F2E" stroke="#2D3748" stroke-width="1"/>
  <text x="80" y="686" dominant-baseline="middle" font-family="Inter, system-ui, sans-serif" font-size="14" fill="#94A3B8">PR1 locks spec — tasks.md and design.md do not change during apply</text>

  <!-- Slide number -->
  <text x="1216" y="700" text-anchor="end" font-family="Inter, system-ui, sans-serif" font-size="14" fill="#64748B">4 / 11</text>
</svg>
