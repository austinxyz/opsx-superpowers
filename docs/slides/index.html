<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OpenSpec Slides</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0F1117; color: #E2E8F0; font-family: system-ui, sans-serif; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
  .container { text-align: center; padding: 40px 20px; }
  h1 { font-size: 28px; font-weight: 700; margin-bottom: 8px; background: linear-gradient(90deg, #4F8EF7, #818CF8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  p { color: #64748B; font-size: 15px; margin-bottom: 48px; }
  .cards { display: flex; gap: 24px; justify-content: center; flex-wrap: wrap; }
  .card { background: #1C1F2E; border: 1px solid #2D3748; border-radius: 12px; padding: 32px 40px; text-decoration: none; color: inherit; transition: border-color 0.2s, transform 0.2s; min-width: 220px; }
  .card:hover { border-color: #4F8EF7; transform: translateY(-2px); }
  .card .icon { font-size: 40px; margin-bottom: 16px; }
  .card h2 { font-size: 18px; font-weight: 600; color: #E2E8F0; margin-bottom: 8px; }
  .card p { color: #64748B; font-size: 13px; margin: 0; }
  footer { margin-top: 48px; font-size: 12px; color: #334155; }
</style>
</head>
<body>
<div class="container">
  <h1>Multi-Engineer OpenSpec Workflow</h1>
  <p>11 slides · Explore → Propose → Apply → Archive → Achieve</p>
  <div class="cards">
    <a class="card" href="en/">
      <div class="icon">🇺🇸</div>
      <h2>English</h2>
      <p>11 slides</p>
    </a>
    <a class="card" href="zh/">
      <div class="icon">🇨🇳</div>
      <h2>中文</h2>
      <p>11 页</p>
    </a>
  </div>
  <footer>opsx-superpowers · feat/harness-validation</footer>
</div>
</body>
</html>
